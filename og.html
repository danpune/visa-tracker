<!doctype html>
<!-- Source for og.png (the WhatsApp/social preview). Render at 1200x630: see README. -->
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>preview</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; background: #14365c; color: #fff; font-family: -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; gap: 56px; padding: 0 72px; }
.left { flex: 1; }
.kicker { font-size: 24px; letter-spacing: 2px; color: #b7c8dd; margin-bottom: 22px; }
h1 { font-size: 66px; line-height: 1.05; font-weight: 800; margin-bottom: 26px; }
.nw { white-space: nowrap; }
.sub { font-size: 27px; line-height: 1.4; color: #dbe5f1; }
.url { font-size: 24px; color: #b7c8dd; margin-top: 34px; }
.card { width: 430px; background: #fff; color: #0b0b0b; border-radius: 26px; padding: 30px 32px 26px; }
.card h2 { font-size: 24px; margin-bottom: 18px; }
.row { display: grid; grid-template-columns: 118px 1fr; align-items: center; gap: 12px; margin: 13px 0; font-size: 20px; }
.bar { height: 26px; border-radius: 0 6px 6px 0; background: #2a78d6; color: #fff; font-size: 17px; font-weight: 600; display: flex; align-items: center; padding-left: 8px; }
.note { font-size: 16px; color: #52514e; margin-top: 14px; }
</style></head>
<body>
  <div class="left">
    <div class="kicker">FREE · OFFICIAL US GOVERNMENT DATA</div>
    <h1>Who sponsors <span class="nw">H-1B</span> and <span class="nw">L-1</span> visas?</h1>
    <div class="sub">Top employers · where the jobs are · what they pay · green card wait times</div>
    <div class="url">danpune.github.io/visa-tracker</div>
  </div>
  <div class="card">
    <h2>Top H-1B sponsors, FY2025</h2>
    <div class="row"><span>Amazon</span><div class="bar" style="width:100%">19,184</div></div>
    <div class="row"><span>Meta</span><div class="bar" style="width:33%">6,295</div></div>
    <div class="row"><span>Microsoft</span><div class="bar" style="width:33%">6,258</div></div>
    <div class="row"><span>TCS</span><div class="bar" style="width:32%">6,139</div></div>
    <div class="row"><span>Google</span><div class="bar" style="width:29%">5,559</div></div>
    <div class="note">Petitions approved by USCIS</div>
  </div>
</body></html>

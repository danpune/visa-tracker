name: Refresh news and visa bulletin
on:
  schedule:
    - cron: "27 12 * * *"   # daily ~8am ET
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # each step may fail on its own (feed down); the other still commits
      - run: python3 update_news.py
        continue-on-error: true
      - run: python3 bulletin.py
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json data.json
          git diff --cached --quiet || (git commit -m "Refresh news and visa bulletin" && git push)
